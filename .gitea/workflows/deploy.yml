# CI — build the Docusaurus site on every branch and PR so breakage
# is caught early. Deployment runs ONLY when a v* tag is pushed. The deploy
# job is imported from johnny/build and receives the built site as an
# artifact - it never sees this repo's source.
#
# Secrets: the called workflow reads real stored secrets by these exact names
# (Gitea does not deliver values mapped in the caller's `secrets:` block):
#   SSH_SERVER, SSH_USER, SSH_PRIVATE_KEY, SSH_HOST_KEY (user-level) and
#   DEPLOY_REMOTE_PATH (per repo: rsync target path for this site)

name: Build and deploy

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Cancel superseded branch/PR builds; never cancel a tag deploy
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Principle of least privilege
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build # canonical URL comes from docusaurus.config.js

      - name: Upload built site
        # NOT actions/upload-artifact: the official v4 action detects Gitea
        # as GHES and aborts. This fork is the same action with that check removed.
        uses: https://github.com/christopherhx/gitea-upload-artifact@v4
        with:
          name: site
          path: build/
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    # Deploy only on v* release tags — never from branches or PRs.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: johnny/build/.gitea/workflows/deploy-static-page.yaml@v11
    with:
      artifact-name: site
    secrets:
      SSH_SERVER: ${{ secrets.SSH_SERVER }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
      DEPLOY_REMOTE_PATH: ${{ secrets.DEPLOY_REMOTE_PATH }}
