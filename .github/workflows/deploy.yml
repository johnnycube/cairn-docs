# CI — build the Docusaurus site on every branch and PR so breakage is caught
# early, and deploy to the static web host on a v* release tag.
#
# GitHub is the golden source; the old .gitea pipeline is retired.
#
# Deploy secrets (repo Settings → Secrets and variables → Actions):
#   DEPLOY_SSH_PASSWORD, DEPLOY_SSH_HOST, DEPLOY_SSH_USER, DEPLOY_PATH

name: Build and deploy

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build # canonical URL comes from docusaurus.config.js

      # Deploy only on a v* release tag.
      - name: Install rsync + sshpass
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          if ! command -v rsync >/dev/null || ! command -v sshpass >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y rsync sshpass
          fi

      - name: Upload to web host
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          SSHPASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          sshpass -e rsync -avz --delete \
            --chmod=D755,F644 \
            -e "ssh -o StrictHostKeyChecking=yes -o PubkeyAuthentication=no" \
            build/ \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH"
